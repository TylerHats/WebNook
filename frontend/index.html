<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebNook</title>
    <meta name="description" content="A friend-group centric, self-hosted social media platform heavily inspired by MySpace with modern vibes, customizable themes, stickers, and PWA support." />
    
    <!-- Anti-Caching Meta Control for Mobile Browsers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, post-check=0, pre-check=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Dynamic Favicon & PWA Manifest -->
    <link id="favicon" rel="icon" type="image/png" href="/branding/logo.png" />
    <link rel="manifest" href="/api/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => console.log('SW reg error: ', err));

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }

      // Emergency self-healing: if an asset fails to load due to MIME mismatch or 404 (obsolete cache)
      window.addEventListener('error', (event) => {
        const target = event.target;
        if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT') && (target.src || target.href)) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const registration of registrations) {
                registration.unregister();
              }
              if ('caches' in window) {
                caches.keys().then((names) => {
                  for (const name of names) caches.delete(name);
                });
              }
            });
          }
        }
      }, true);
    </script>
  </body>
</html>
